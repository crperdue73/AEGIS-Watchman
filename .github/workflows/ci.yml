name: CI

# Everything in this repo is meant to be run by a stranger on a fresh host, and
# the v1 definition of done (PHASE1-PLAN.md) is exactly that: build, run, and
# reproduce a detection from shipped artifacts. CI is that promise, executed.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build + vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pin to the module's own `go` directive, not "latest" — a build that
          # needs a toolchain newer than go.mod claims is the bug this catches.
          go-version-file: go.mod
          cache: true
      - name: Build
        run: make build
      - name: Rule-pack pin is current
        # The shipped pack has a committed pin (rules/packs.pins). If the pack
        # changed without re-pinning, the fleet would run packs the pin does not
        # approve — fail the build and tell the author to run `make pin`.
        # Same target runs locally (wired into `make lint`), so a green local
        # run and a green CI run mean the same thing.
        run: make pin-check
      - name: Vet (default and sqlite builds)
        run: |
          go vet ./...
          go vet -tags sqlite ./...
      - name: Test (default)
        run: go test ./...
      - name: Test (sqlite record backend)
        run: go test -tags sqlite ./...
      - name: Test (race)
        # The central service, the collector poll loop, and the durable spool are
        # all concurrent; a data race there is an intermittent failure in a
        # detector, which is worse than a loud one. Same target runs in
        # preflight, so a green local run and a green CI run mean the same thing.
        run: make test-race

  lint:
    name: lint (vet + doc link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: make lint
        run: make lint

      # lint runs a checker I wrote on a host with no Go toolchain, so it was
      # proven by hand and the receipt was thrown away. This exercises the alarm
      # itself: 8 synthetic trees, 4 of them asserting the checker stays QUIET.
      # Without those 4 the suite is satisfied by a checker that rejects
      # everything — which is what it did on its first run (31 false findings).
      - name: pkgcheck can still fail
        run: make pkgcheck-selfcheck

      # The guard that enforces "preflight covers CI" was itself run by nothing
      # in CI — a drift went red only for whoever happened to run lint locally,
      # and did not fail the push. It runs here so it can now fail the push.
      - name: preflight covers every CI step
        run: make ci-parity-check

      - name: the parity guard can still fail
        run: make ci-parity-selfcheck

  demo:
    name: end-to-end demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The definition-of-done walkthrough: build, start the real central, run
      # real collector passes through the fixtures, print the alerts and the
      # fleet rollup — no root, no auditd, no Docker daemon. If this passes on a
      # clean runner, a stranger can reproduce it.
      - name: demo/run.sh
        run: ./demo/run.sh

  quickstart:
    name: quickstart (the doc's commands, run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Runs exactly the commands docs/quickstart.md tells a stranger to run.
      # The demo job above guards the demo path; this guards the *other* path,
      # and it is what would have caught the untracked-file defect (three files
      # present in the tree but not committed): a checkout missing a file the
      # doc references fails here, on the pull request, not a day after release.
      - name: make quickstart-check
        run: make quickstart-check

  container:
    name: container image (built, not just read)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Guards the class heartbeat 66 found: the Dockerfile had never been
      # built, so a static binary was copied into a distroless (no-libc)
      # runtime and could not exec. demo/ and quickstart-check need no Docker,
      # so neither could catch it. This job builds the real image and asserts
      # the documented claims (nonroot uid 65532, baked rule pack loads, the
      # /etc/watchman shadow caveat, static binaries). GitHub's runner has a
      # Docker daemon; a red job here means a container doc stopped being true.
      - name: make container-check
        run: make container-check

  publish:
    name: publish scan (nothing private ships)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1 checkout: `make
          # cut-release-check` clones this checkout and pushes a branch to a
          # scratch remote, and git refuses to push a shallow branch ("shallow
          # update not allowed"). Without this, the cut-guard step below is red.
          # The scan is unaffected: run post-push, its "unpushed commits" range
          # is empty either way, so it guards the tree here. History protection
          # is inherently a pre-push, local concern — see docs/PUBLISH-READINESS.md.
          fetch-depth: 0
      # This repo is public under Apache-2.0 and was developed in a private
      # workspace. A credential pasted into a test, a real operator home path, or
      # private infrastructure in a fixture is invisible in review and permanent
      # once pushed. This job scans the tracked tree *and* the commits a push
      # would publish — history is permanent, so a value committed and later
      # removed still ships. See scripts/publish-scan.sh and
      # docs/PUBLISH-READINESS.md.
      - name: make publish-scan
        run: make publish-scan
      # The scan's history scope is load-bearing (which range, the empty range,
      # the absent upstream, warn-vs-fail). Exercise it in a throwaway repo so a
      # bug cannot silently stop catching the classes it exists to catch.
      - name: make publish-scan-check
        run: make publish-scan-check
      # The cut script enforces the release rules as code and refuses the ways to
      # get them wrong. Exercise it end to end here too, so a broken refusal
      # shows up on a push rather than at a real cut on the public repo. See
      # scripts/cut-release-check.sh — and note it needs the full-depth checkout
      # above, since it pushes a branch to a scratch remote.
      - name: make cut-release-check
        run: make cut-release-check

  fuzz:
    name: fuzz (untrusted input never panics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Every stream this tool reads is attacker-influenced (auditd argv, docker
      # events off a socket, a community rule pack), so a parser or matcher that
      # panics on crafted input is a denial of service against the detector. This
      # job fuzzes each target for a bounded time. A crash writes its reproducer
      # to testdata/fuzz/ (which then runs under `make test`), so the finding is
      # never lost. `go test ./...` already replays the seed corpus; this adds a
      # live search on top. See scripts/fuzz.sh.
      - name: make fuzz
        run: make fuzz
        env:
          FUZZTIME: 15s

  deps:
    name: dependencies (licenses permissive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # A security tool shipping under Apache-2.0 must not link a copyleft
      # dependency, and the risk only ever arrives through a transitive
      # upgrade. Read each compiled module's license from the module cache and
      # fail on copyleft or unknown. `go mod download` populates the cache the
      # check reads.
      - name: download modules
        run: go mod download
      - name: make deps-report
        run: make deps-report
