# agentids central — example config
# Copy to central.yaml next to the binary. A missing file uses these defaults,
# so the service runs out of the box.

addr: ":8080"

# Durable baseline store. Survives restarts; file is created 0600.
store: /var/lib/agentids/baselines.json

# Cap on the unified diff attached to each drift event. 0 = hash-only
# (no file bodies in alerts). Does not affect what is stored as baseline.
max_diff_bytes: 4096

# Mutual TLS on the ingest listener. When set, collectors MUST present a
# cert signed by this CA; unauthenticated clients are rejected at the
# handshake. Generate material with deploy/gen-certs.sh.
tls:
  cert: /etc/agentids/leaf.crt
  key: /etc/agentids/leaf.key
  ca: /etc/agentids/ca.crt

# Layer 2 — provenance/attestation. Points at the signed approval manifests
# (one *.json per agent root, built with `agentids-manifest sign`). When set,
# each ingest is checked against the approved manifest and any unapproved or
# modified file raises provenance.untrusted. Delete this block to disable.
manifests:
  dir: /etc/agentids/manifests
  # JSON file of {"name": "base64-ed25519-pubkey"} that may have signed the
  # manifests. A manifest signed by anything else is refused at load. Omit to
  # skip signature checking (manifests trusted as shipped).
  trust_keys: /etc/agentids/trust-keys.json
  # true -> an agent with NO manifest on record is treated as fully untrusted
  # (every file raises provenance.untrusted). Off by default so an un-migrated
  # fleet is not drowned in alerts during rollout.
  require_approval: false

alerts:
  # Any HTTP endpoint that accepts a JSON POST. Slack incoming webhooks,
  # PagerDuty Events API v2, a ticket bot, or a tiny shell receiver.
  # The body is an agentids Alert: {when, host, agent, events[]}.
  webhook: https://hooks.example/agentids
  # Also write a one-line summary per alert to the service log. Default: true.
  log: true
  # Email each alert as a plain-text SMTP message. Delete this block to disable.
  email:
    host: smtp.example.com:587   # port 465 = implicit TLS; others use STARTTLS
    username: agentids
    password: change-me
    from: agentids@example.com
    to: [oncall@example.com]
    # allow_plaintext: true     # needed only for a trusted local relay without TLS
