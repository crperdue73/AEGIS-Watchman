# watchman collector — example config
# One collector runs per host. See PHASE0-DISCOVERY.md §0.4.

agent_roots:
  - path: /home/*/.openclaw/workspace-*
    include:
      - SOUL.md
      - IDENTITY.md
      - MEMORY.md
      - skills/**/*.md
      - "*.config.json"
    exclude:
      - "**/*.tmp"
      - "**/.git/**"

hash: sha256

watch:
  mode: inotify        # or: poll (fallback for non-Linux / restricted hosts)
  poll_interval: 60s

report:
  endpoint: https://central.example/api/v1/events
  interval: 30s
  # Mutual TLS to the central service. Recommended for any real fleet: the
  # inventory names every agent persona file on the host, so the hop is
  # authenticated in both directions. Generate material with deploy/gen-certs.sh.
  tls:
    cert: /etc/watchman/leaf.crt
    key: /etc/watchman/leaf.key
    ca: /etc/watchman/ca.crt
    server_name: central.example   # must match the cert SAN; or use localhost

attribution:
  source: auditd       # optional; enables "who changed it". null = drift without actor.

# Layer 3: behavior rules ("Snort for agents"). Rules match on ACTIONS, not
# files — the CARBONATO edit is a file, but the theft that follows is an action,
# and only a behavior rule names it. Omit this block (or leave rules_dir empty)
# to run Layers 1/2 only.
#
# Matches ship to <report.endpoint with /events -> /actions> and page through
# the same alerting path as drift.
behavior:
  rules_dir: /etc/watchman/rules   # *.yaml rule packs, loaded sorted by name
  audit_log: /var/log/audit/audit.log   # execve + connect source; must exist if set; empty = rules idle
  # Pin the pack set: the collector then refuses to start Layer 3 if rules_dir
  # does not match the pin (a changed, missing, or unpinned pack). Add
  # pin_pubkey to also require the pin's detached Ed25519 signature. See
  # docs/rules.md. Generate with `watchman-rules pin` + `sign-pins`.
  # pins: /etc/watchman/packs.pins
  # pin_pubkey: /etc/watchman/ops.key.pub
  # Durable spool: rule matches are queued here BEFORE shipping, so a central
  # outage costs latency, not evidence. Recommended on any host you care about.
  spool: /var/lib/watchman/spool.jsonl
  spool_max_bytes: 16777216   # 16 MiB; oldest entries dropped past it

  # Optional eBPF file.access adapter. ADDITIVE to audit_log, never a
  # replacement — it catches a secret read that never names the path on the
  # command line (a python -c wrapper), which the argv rules cannot. Needs a
  # modern kernel + CAP_BPF, and a binary built with `-tags ebpf`. If it cannot
  # load, the collector logs one line and runs auditd-only; it never fails to
  # start. See docs/R2-EBPF-DESIGN.md.
  ebpf:
    enabled: false              # flip on once you have built with -tags ebpf
    object_path: ""             # empty = the object embedded in the binary
    # Path prefixes the kernel-side filter keeps (only these reach userspace).
    # Empty = the built-in secret-store defaults (~/.ssh, ~/.aws, ~/.openclaw...).
    watch_paths: []
    ringbuf_bytes: 0            # 0 = 1 MiB per CPU

  # Container-runtime adapter (R3, gap G4): reads `docker events` and emits
  # container.start actions, so a privileged / host-mounted container is caught
  # the moment it appears — including one created straight against the Docker
  # API on :2375, where no `docker` command was ever typed. Additive like eBPF:
  # a host with no Docker daemon simply has nothing to report.
  docker:
    enabled: false              # flip on for hosts that run a Docker daemon
    bin: ""                     # empty = "docker"
    inspect: true               # enrich events with HostConfig (privileged,
                                # host PID/net, host-root mounts) via `docker inspect`
    # events_args: []           # empty = ["events", "--format", "{{json .}}"]

# Enable the telemetry source with an auditd rule (only execve is on by
# default). Drop this in /etc/audit/rules.d/watchman.rules and reload:
#
#   -a always,exit -F arch=b64 -S execve -k watchman
#   -a always,exit -F arch=b64 -S connect -k watchman
#   -a always,exit -F arch=b64 -S bind -k watchman
#   -a always,exit -F arch=b64 -S listen -k watchman
#   # ...plus the 32-bit variants on a mixed-arch host
#
# `augenrules --load` (or `service auditd restart`) to apply. Without the
# connect line only process.exec fires; without bind/listen the kernel-side
# listener rule (carbonato.net.listener_bound) cannot.
