# agentids collector — example config
# One collector runs per host. See PHASE0-DISCOVERY.md §0.4.

agent_roots:
  - path: /home/*/.openclaw/workspace-*
    include:
      - SOUL.md
      - IDENTITY.md
      - MEMORY.md
      - skills/**/*.md
      - "*.config.json"
    exclude:
      - "**/*.tmp"
      - "**/.git/**"

hash: sha256

watch:
  mode: inotify        # or: poll (fallback for non-Linux / restricted hosts)
  poll_interval: 60s

report:
  endpoint: https://central.example/api/v1/events
  interval: 30s
  # Mutual TLS to the central service. Recommended for any real fleet: the
  # inventory names every agent persona file on the host, so the hop is
  # authenticated in both directions. Generate material with deploy/gen-certs.sh.
  tls:
    cert: /etc/agentids/leaf.crt
    key: /etc/agentids/leaf.key
    ca: /etc/agentids/ca.crt
    server_name: central.example   # must match the cert SAN; or use localhost

attribution:
  source: auditd       # optional; enables "who changed it". null = drift without actor.

# Layer 3: behavior rules ("Snort for agents"). Rules match on ACTIONS, not
# files — the CARBONATO edit is a file, but the theft that follows is an action,
# and only a behavior rule names it. Omit this block (or leave rules_dir empty)
# to run Layers 1/2 only.
#
# Matches ship to <report.endpoint with /events -> /actions> and page through
# the same alerting path as drift.
behavior:
  rules_dir: /etc/agentids/rules   # *.yaml rule packs, loaded sorted by name
  audit_log: /var/log/audit/audit.log   # execve source; empty = rules idle
