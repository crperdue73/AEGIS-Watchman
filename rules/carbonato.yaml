# carbonato — Layer 3 rule pack
#
# Rules match on ACTIONS (process.exec, net.egress, file.access, scope.change),
# not on files. A rule fires when every predicate in its `match` block matches;
# slices (argv_any, path_glob_any, ...) fire if ANY element matches.
#
# This pack targets the CARBONATO-class "agent as insider" technique: an
# operator gets code or text into an agent's context, the agent is then induced
# to read secrets, reach for new capabilities, or exfiltrate to a new endpoint.
# Each rule carries a `technique` tying it to the brief where possible.
#
# Globs use shell-style path.Match semantics and are checked against the value
# itself and its basename.

name: carbonato
version: "7"

rules:
  - id: carbonato.tool.scope_new
    title: Agent requests a tool or capability not previously seen
    severity: high
    technique: phase3/scope-expansion
    description: >
      A scope.change action naming a capability that is not part of the agent's
      approved set is the CARBONATO "reach for more" signal. In v1 the event is
      DERIVED by the collector's scope shim from first-use telemetry (a new
      listener, a new outbound endpoint, a new executable under an agent root);
      detail.source="heuristic" marks it as a derivation, not ground truth, and
      detail.novel=true is what this rule keys on. When an agent-native control
      plane exists it will emit the same shape with detail.source="agent" and
      this rule fires unchanged (coverage gap G5/A10 — partial in v1).
    match:
      type: scope.change
      detail_equals:
        novel: "true"

  - id: carbonato.secret.read_order_follows_constraint
    title: Agent reads a credential store after a constraint-ignoring prompt
    severity: critical
    technique: phase3/secret-access
    description: >
      The canonical CARBONATO ordering: a prompt tells the agent to ignore prior
      constraints and read credentials. A file.access into ~/.ssh, ~/.aws, or a
      keychain after such a prompt is the exfil precursor.
    match:
      type: file.access
      path_glob_any:
        - "*/.ssh/*"
        - "*/.aws/*"
        - "*id_rsa*"
        - "*id_ed25519*"
        - "*/.config/gcloud/*"
        - "*/.kube/config*"
        - "*credentials*"
        - "*.env"

  - id: carbonato.exfil.egress_after_change
    title: Outbound egress to a chat/C2 endpoint from a build context
    severity: high
    technique: phase3/exfiltration
    description: >
      An agent making outbound calls to a chat service or a blockchain RPC
      endpoint from a build/CI context has no legitimate reason to; combined
      with a recent identity change it is the exfil leg.
    match:
      type: net.egress
      # NOTE (open, pack owner's call — FINDING-2026-10-26-endpoint-containment):
      #   * Two globs below are SHADOWED by a broader sibling and can never widen coverage:
      #     "*hooks.slack.com*" is covered by "*slack.com*"; "*api.telegram.org*" is covered by
      #     "*telegram.org*". A miss, not an exploit — but it reads more precise than it is.
      #   * Every glob here is a bare "*x*" shape, and the engine's contains fallback is a
      #     SUBSTRING test on the whole endpoint string, so "*slack.com*" also matches
      #     "evil-slack.com.evil:443". Noise, not a blind spot. Anchoring (leading-dot / full
      #     host form) is the pack's problem, not the collector's.
      #   * "*/api/v2/events*" cannot fire at all against a "host:port" endpoint — see
      #     FINDING-2026-10-24-endpointfire (beat 546).
      # Instrument: scripts/endpointglob_test.py. Changing these lines changes rule semantics.
      endpoint_glob_any:
        - "*slack.com*"
        - "*discord.com*"
        - "*telegram.org*"
        - "*hooks.slack.com*"      # shadowed by *slack.com*
        - "*api.telegram.org*"     # shadowed by *telegram.org*
        - "*pastebin.com*"
        - "*transfer.sh*"
        - "*/api/v2/events*"        # dead against host:port (beat 546)

  - id: carbonato.exec.shell_spawn
    title: Agent process spawns a shell or script interpreter
    severity: medium
    technique: phase3/execution
    description: >
      An agent spawning sh/bash/powershell/python is not automatically hostile,
      but in a persona-only agent it is a strong escalation signal and correlates
      with the more specific secret-access rules.
    match:
      type: process.exec
      exe_any:
        - sh
        - bash
        - zsh
        - dash
        - powershell
        - pwsh
        - python
        - python3
        - perl
        - ruby

  - id: carbonato.exec.ssh_key_heredoc
    title: Shell command references an SSH private key or known_hosts
    severity: high
    technique: phase3/secret-access
    description: >
      A command line that names an SSH private key (cat/grep/base64 over
      ~/.ssh/id_*) is the read half of a key-exfil chain. Bare key-in-argv is
      rare outside of exfil tooling.
    match:
      type: process.exec
      argv_any:
        - "*.ssh/id_*"
        - "*id_rsa*"
        - "*id_ed25519*"
        - "*/.ssh/known_hosts*"

  - id: carbonato.persist.survives_session
    title: Agent process survives its parent user session
    severity: medium
    technique: phase3/persistence
    description: >
      A process that keeps running after its spawning session exits is a
      persistence signal (systemd-run, nohup, setsid, disown).
    match:
      type: process.exec
      argv_any:
        - "*nohup*"
        - "*setsid*"
        - "*systemd-run*"
        - "*disown*"

  # --- v2: correlation rules (temporal; need a timeline) ---------------------

  - id: carbonato.exfil.egress_after_identity_change
    title: Outbound call within 5m of an identity-file change
    severity: critical
    technique: phase3/correlated-exfil
    description: >
      The brief's canonical correlation. An outbound call is ordinary in
      isolation; an outbound call shortly after the agent's own identity file
      changed is the exfil leg of a CARBONATO chain. Decided against the
      per-host timeline, not the action alone. See internal/rules/timeline.go.
    match:
      type: net.egress
      endpoint_glob_any:
        - "*slack.com*"
        - "*discord.com*"
        - "*telegram.org*"
        - "*pastebin.com*"
        - "*transfer.sh*"
        - "*0x0.st*"
        # v6: a chain RPC call after an identity change is the same exfil/C2
        # shape as a chat call after one (the Graphalgo construction).
        - "*infura.io*"
        - "*alchemy.com*"
        - "*quiknode.pro*"
        - "*ankr.com*"
        - "*arbitrum.io*"
        - "*polygon-rpc.com*"
        - "*llamarpc.com*"
      prior_event:
        class: identity.drift
        within: 5m

  # --- v6: blockchain-RPC C2 (the mock-Graphalgo leg) -------------------------
  #
  # The brief's second source: C2 over a smart contract, reached through a
  # public RPC provider — "no server to seize, block, or sinkhole." An agent
  # (as opposed to a crypto app) has no business talking to a chain RPC
  # endpoint, and a chain call shortly after an identity change is the same
  # exfil/C2 shape as the chat-endpoint correlation.

  - id: carbonato.c2.blockchain_rpc
    title: Agent process egresses to a blockchain RPC endpoint
    severity: medium
    technique: phase3/command-and-control
    description: >
      A public chain RPC provider (Infura, Alchemy, QuickNode, Ankr, Chainstack,
      a public Polygon/Llama RPC, or an Arbitrum RPC) is a C2 channel that cannot
      be seized or sinkholed — the command lives in a smart contract, not on a
      server. The brief names this explicitly alongside chat C2. Medium on its
      own: some agents legitimately touch a chain. It escalates to the critical
      correlation rule above when it follows an identity-file change.
    match:
      type: net.egress
      endpoint_glob_any:
        - "*infura.io*"
        - "*alchemy.com*"
        - "*alchemyapi.io*"
        - "*quiknode.pro*"
        - "*ankr.com*"
        - "*chainstack.com*"
        - "*polygon-rpc.com*"
        - "*llamarpc.com*"
        - "*arbitrum.io*"
        - "*etherscan.io/api*"
        - "*bscscan.com/api*"

  - id: carbonato.secret.read_after_shell
    title: Credential read within 2m of a shell spawn
    severity: critical
    technique: phase3/correlated-secret-access
    description: >
      A shell spawn followed closely by a credential-store read is the read half
      of the CARBONATO chain: the shell is the tool, the read is the act. Two
      medium signals correlated into one critical.
    match:
      type: file.access
      path_glob_any:
        - "*/.ssh/*"
        - "*/.aws/*"
        - "*id_rsa*"
        - "*id_ed25519*"
        - "*/.kube/config*"
      prior_event:
        class: process.exec
        within: 2m

  # --- v2: additional single-action rules ------------------------------------

  - id: carbonato.tool.package_install
    title: Agent installs a package or downloads an executable
    severity: medium
    technique: phase3/execution
    description: >
      An agent fetching and running new code (curl|sh, wget, pip install,
      npm install -g, apt-get install) is capability acquisition — the step
      between "reaching for scope" and "using it". A bare "*wget*" was too
      eager (any bounded download fired), so the fetch globs require the
      execute half (pipe to a shell, or a write into an agent-owned path);
      the package-manager globs are already unambiguous.
    match:
      type: process.exec
      argv_any:
        - "*| sh*"
        - "*|sh*"
        - "* -O /home/*"
        - "* -O /tmp/*"
        - "*pip install*"
        - "*pip3 install*"
        - "*npm install -g*"
        - "*apt-get install*"
        - "*apt install*"

  - id: carbonato.secret.read_model_key
    title: Agent reads a model-endpoint or API-key file
    severity: high
    technique: phase3/secret-access
    description: >
      The CARBONATO ordering in its purest form: the file the agent already has
      cause to touch (an API key for its model endpoint) becomes the thing it
      exfiltrates. Reading it is normal; reading it in a build context is not.
    match:
      type: file.access
      path_glob_any:
        - "*/openai*key*"
        - "*/.config/openai*"
        - "*anthropic*key*"
        - "*/.config/gcloud/application_default_credentials.json*"
        - "*/.netrc*"
        - "*/.docker/config.json*"
        - "*/.git-credentials*"

  - id: carbonato.exec.obfuscation
    title: Agent runs an encoding/decoding pipeline
    severity: medium
    technique: phase3/defense-evasion
    description: >
      base64/xxd/openssl enc over data in argv is a common exfil and
      defense-evasion pattern — the payload stops being greppable once encoded.
    match:
      type: process.exec
      argv_any:
        - "*base64*"
        - "*xxd*"
        - "*openssl enc*"
        - "*tar cz*"
        - "*tar -cz*"

  - id: carbonato.persist.cron_or_rc
    title: Agent writes to a persistence location
    severity: high
    technique: phase3/persistence
    description: >
      Writing a cron entry, a shell rc file, or a systemd unit is the agent
      arranging to run again without being asked. Distinct from surviving a
      session: this changes the host's own schedule. The globs name the exact
      files and directories persistence lives in; a bare "*.profile*" would
      also match a harmless flag like "--profile", so the rc entries are
      anchored on the leading dot/dir (dogfooded after the P1.4 quality pass).
    match:
      type: process.exec
      argv_any:
        - "*crontab*"
        - "*/etc/cron*"
        - "*/.bashrc*"
        - "*/.bash_profile*"
        - "*/.profile"
        - "*/.zshrc*"
        - "*/etc/systemd/system*"
        - "*authorized_keys*"

  - id: carbonato.persist.file_write
    title: Agent writes to a persistence or credential location
    severity: high
    technique: phase3/persistence
    description: >
      The kernel-side counterpart to carbonato.persist.cron_or_rc. An auditd
      file watch on the host's persistence paths catches the write itself: the
      path comes from the kernel, not the command line, so a script or a
      wrapped interpreter that drops a cron entry without ever naming the file
      in argv still fires. This is the writable half of coverage gap G3 and it
      needs no eBPF object — only the file-watch rules in the deploy guide
      (`-w <path> -p wa -k watchman`). Without those rules file.write is simply
      not emitted and this rule stays idle, exactly like the eBPF rule without
      the kernel source.
    match:
      type: file.write
      path_glob_any:
        - "*/etc/cron.d/*"
        - "*/etc/cron.daily/*"
        - "*/etc/cron.hourly/*"
        - "*/etc/crontab"
        - "*/etc/systemd/system/*"
        - "*/.bashrc"
        - "*/.bash_profile"
        - "*/.profile"
        - "*/.zshrc"
        - "*/authorized_keys"

  - id: carbonato.infra.privileged_container
    title: Container launched privileged with host mounts
    severity: high
    technique: phase3/container-escape
    description: >
      The brief's 2375 entry vector: a container started --privileged with a
      host path bind-mounted is a container escape waiting to happen.
    match:
      type: process.exec
      exe_any: [docker, podman, nerdctl]
      argv_any:
        - "*--privileged*"
        # Was "*-v /*:/", which had an INTERIOR star: substringNeedle refuses those, and path.Match
        # cannot span a command line's slashes, so it never fired once (beat 611). This form carries
        # needle "-v /:" and targets the case that matters -- SOURCE exactly "/", i.e. the host root.
        # Verified against 6 docker invocations: catches -v /:/host and -v /:/data, silent on
        # -v /etc:/etc, -v /app:/app and every other absolute-source bind. See
        # docs/FINDING-2026-10-27-host-root-mount-rule.md
        - "*-v /:*"
        - "*--pid=host*"
        - "*--net=host*"

  - id: carbonato.net.new_listener
    title: Agent process opens a listening socket
    severity: medium
    technique: phase3/command-and-control
    description: >
      An agent-bound process that starts listening (nc -l, socat, python -m
      http.server) is establishing a foothold or a beacon, not doing its job.
      This rule catches the intent from the command line; the net.listen rule
      below catches it from the kernel, so a listener whose argv is hidden
      (python -c, a script, a renamed binary) still fires.
    match:
      type: process.exec
      argv_any:
        - "*nc -l*"
        - "*ncat -l*"
        - "*socat*"
        - "*http.server*"
        - "*--listen*"

  - id: carbonato.net.listener_bound
    title: Process binds a listening socket
    severity: medium
    technique: phase3/command-and-control
    description: >
      The auditd bind syscall carries the local address a process is listening
      on, whether or not the command line says so. This is the kernel-side
      counterpart to carbonato.net.new_listener: it fires for a listener
      started by a wrapped or renamed binary, where argv_any would miss. A
      bind to a wildcard or a high port under an agent account is a foothold,
      not a service.
    match:
      type: net.listen
      detail_non_empty:
        - "listen"

  # --- v4: container-runtime telemetry (G4, from the docker events adapter) ---
  #
  # These match on container.start, the action emitted by
  # internal/telemetry/docker.go when a container appears on a host. Unlike the
  # argv-based carbonato.infra.privileged_container above (which needs the
  # `docker` CLI to have been typed), these fire even when the container is
  # created directly against an unauthenticated Docker API on :2375 — the exact
  # CARBONATO entry vector — because the *daemon* emits the event, not a shell.

  - id: carbonato.container.privileged_start
    title: A privileged, host-access container started on the host
    severity: critical
    technique: phase3/container-escape
    description: >
      The CARBONATO entry: a container started with host-level access. Any of
      --privileged, host PID namespace, host network, or a host-root bind mount
      is a container that can reach the host. This is the kernel-side,
      daemon-side counterpart to the argv rule — it cannot be evaded by hiding
      the command line, because no command line was involved.
    match:
      type: container.start
      detail_non_empty_any:
        - "privileged"
        - "host_pid"
        - "host_network"

  - id: carbonato.container.host_root_mount
    title: Container started with a host-root or host-socket mount
    severity: critical
    technique: phase3/container-escape
    description: >
      A bind mount of the host root (`/:/host`) or the Docker socket
      (`/var/run/docker.sock`) from a container is either an escape primitive or
      a way to talk to the host daemon directly. Named separately from the
      privileged rule so the alert says which one it saw.
    match:
      type: container.start
      detail_glob_any:
        binds:
          # REMOVED beat 614: "*:/host*" fired on ANY destination segment containing "host", so
          # `docker run -v /etc:/host` -- mounting the host's /etc INTO the container, the OPPOSITE of
          # an escape -- tripped a CRITICAL rule (beat 611 defect 1).
          # I first tried tightening it to "*/:/host*" (source pinned to "/"). Measured, then deleted
          # it instead: '*/:/host*' had ZERO unique witnesses. Every host-root bind it matched --
          # /:/host, /:/host/etc, /:/host/home/u -- is already matched by "/:/", whose needle "/:/"
          # is a plain substring of "/:/host". The glob was doing no work.
          # So the false positive was not a too-broad glob needing a narrower one: it was a redundant
          # glob whose ONLY distinct effect was the false positive. Deleting it removes both.
          # "/:/" covers the host root; keep it.
          - "/:/"
          - "*/var/run/docker.sock*"

  - id: carbonato.container.after_identity_change
    title: Container started within 10m of an identity-file change
    severity: critical
    technique: phase3/correlated-container-escape
    description: >
      The full CARBONATO shape timed: an agent's persona/skill file changed, and
      shortly after, a container appeared with host access. Either half alone is
      investigable; together they are the intrusion's spine.
    match:
      type: container.start
      detail_non_empty_any:
        - "privileged"
        - "host_pid"
        - "host_network"
      prior_event:
        class: identity.drift
        within: 10m
